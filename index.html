<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de mapeamento de processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* Tokens: identidade Empresa JR (escuro como padrão) */
:root{
  --bg:#00031B; --bg-2:#04002B; --panel:rgba(6,10,52,.78); --panel-solid:#070C3C;
  --line-soft:rgba(150,165,255,.18); --line-strong:rgba(190,200,255,.42);
  --ink:#F1F3FF; --muted:#A9B1D8; --link:#93A5FF; --tint:rgba(0,26,255,.16);
  --blue:#001AFF; --blue-2:#002CAE; --deep:#001450;
  --accent:#EAC200; --accent-ink:#00031B; --ok:#7BE0A6;
  --glow-1:rgba(0,26,255,.55); --glow-2:rgba(0,44,174,.5); --glow-3:rgba(0,26,255,.22);
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --topbar:60px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5FF; --bg-2:#E6EAFF; --panel:rgba(255,255,255,.86); --panel-solid:#FFFFFF;
    --line-soft:rgba(0,20,80,.13); --line-strong:rgba(0,20,80,.32);
    --ink:#00031B; --muted:#4A5378; --link:#0019E0; --tint:rgba(0,26,255,.07);
    --ok:#1D7A4A; --glow-1:rgba(0,26,255,.20); --glow-2:rgba(0,44,174,.16); --glow-3:rgba(0,26,255,.08);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5FF; --bg-2:#E6EAFF; --panel:rgba(255,255,255,.86); --panel-solid:#FFFFFF;
  --line-soft:rgba(0,20,80,.13); --line-strong:rgba(0,20,80,.32);
  --ink:#00031B; --muted:#4A5378; --link:#0019E0; --tint:rgba(0,26,255,.07);
  --ok:#1D7A4A; --glow-1:rgba(0,26,255,.20); --glow-2:rgba(0,44,174,.16); --glow-3:rgba(0,26,255,.08);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topbar) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:1rem;line-height:1.65;min-height:100vh}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 38% at 8% 0%, var(--glow-1), transparent 70%),
    radial-gradient(34% 34% at 96% 6%, var(--glow-2), transparent 70%),
    radial-gradient(40% 32% at 55% 100%, var(--glow-3), transparent 70%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
}
a{color:var(--link)}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
h1[tabindex="-1"]:focus{outline:none}

/* Barra superior */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--topbar);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line-strong);background:transparent;border-radius:999px;cursor:pointer;flex:none}
.menu-btn svg{width:18px;height:18px}
.logo-link{display:flex;align-items:center;flex:none}
.logo{height:28px;width:auto;display:block}
.logo-light{display:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .logo-dark{display:none}:root:not([data-theme="dark"]) .logo-light{display:block}}
:root[data-theme="light"] .logo-dark{display:none}
:root[data-theme="light"] .logo-light{display:block}
.title-pill{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-size:.84rem}
.title-pill a{color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);white-space:nowrap;flex:none}
.bar{width:96px;height:5px;border-radius:3px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}
@media (max-width:560px){
  .title-pill a{display:none}
  .title-pill{justify-content:flex-end;flex:1}
  .bar{width:56px}
  .logo{height:24px}
}

/* Estrutura */
.layout{display:grid;grid-template-columns:1fr}
.index{
  position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(86vw,320px);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:var(--panel-solid);border-right:1px solid var(--line-soft);overflow-y:auto;
  transform:translateX(-102%);transition:transform .25s ease;
}
.index.open{transform:none}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,3,27,.55);display:none}
.scrim.show{display:block}
.ix-head{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.ix-head strong{font-family:var(--display);font-stretch:70%;font-weight:700;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em}
.ix-close{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px}
.ix-close svg{width:18px;height:18px}
.ix-list{list-style:none;margin:0;padding:0}
.ix-item{display:grid;grid-template-columns:32px 1fr 18px;align-items:center;gap:6px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3}
.ix-item:hover{background:var(--tint)}
.ix-item[aria-current="page"]{background:linear-gradient(90deg,var(--blue),var(--blue-2));color:#fff}
.ix-item[aria-current="page"] .ix-n{color:#fff}
.ix-n{font-family:var(--display);font-weight:700;font-stretch:65%;font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ix-ok{width:16px;height:16px;color:var(--ok);visibility:hidden}
.ix-item.seen .ix-ok{visibility:visible}
.ix-item[aria-current="page"] .ix-ok{color:#fff}
.ix-sub{list-style:none;margin:2px 0 6px 38px;padding:0;border-left:1px solid var(--line-soft)}
.ix-sub .ix-item{grid-template-columns:1fr 18px;font-size:.86rem;padding:6px 10px}
.ix-foot{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--line-soft)}
.link-btn{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

main{padding:20px 14px 48px;min-width:0}
.sheet{max-width:820px;margin:0 auto 18px;background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line-soft);border-radius:22px;padding:22px 20px 26px}
@media (min-width:1000px){
  .menu-btn,.ix-close,.scrim{display:none !important}
  .layout{grid-template-columns:300px 1fr}
  .index{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar));height:calc(100dvh - var(--topbar) - env(safe-area-inset-top,0px));transform:none;width:auto;z-index:1;padding-top:16px;background:transparent;border-right:1px solid var(--line-soft)}
  main{padding:30px 32px 64px}
  .sheet{padding:30px 38px 36px}
}

/* Tipografia */
h1,h2,h3,h4{line-height:1.15;margin:0}
.display{font-family:var(--display);font-stretch:64%;font-weight:700;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
.sheet h2{font-size:1.28rem;font-weight:700;margin:2em 0 .6em;padding-top:.9em;border-top:1px solid var(--line-soft)}
.sheet h3{font-size:1.06rem;font-weight:700;margin:1.5em 0 .4em}
.sheet p{margin:.7em 0;max-width:68ch}
.lead{font-size:1.1rem;line-height:1.6}
.muted{color:var(--muted)}
.sheet ul,.sheet ol{padding-left:1.25em;max-width:66ch}
.sheet li{margin:.35em 0}
strong,b{font-weight:650}

/* Cabeçalho do módulo (card azul da marca) */
.mod-head{
  position:relative;overflow:hidden;border-radius:18px;padding:18px 20px 22px;margin:0 0 20px;color:#fff;
  background:linear-gradient(165deg,#001AFF 0%,#002CAE 48%,#001450 100%);
}
.mod-head::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);filter:blur(8px);pointer-events:none}
.mod-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;position:relative;z-index:1}
.mod-pills span{border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:2px 10px;font-size:.76rem;line-height:1.5}
.mod-num{font-size:3rem;display:block;margin-bottom:4px;position:relative;z-index:1}
.mod-head h1{font-size:clamp(2rem,6.4vw,3rem);position:relative;z-index:1}
.mod-head p{margin:.55em 0 0;color:rgba(255,255,255,.86);font-size:.97rem;line-height:1.45;max-width:58ch;position:relative;z-index:1}
.crumbs{font-size:.82rem;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.crumbs span[aria-current]{color:var(--ink);font-weight:600}

/* Resumo para leitura rápida */
.resumo{border:1px solid var(--line-strong);border-radius:16px;padding:14px 18px 10px;margin:0 0 8px;background:var(--tint)}
.resumo h2{border:0 !important;padding:0 !important;margin:0 0 4px !important;font-size:.95rem !important;display:flex;align-items:center;gap:8px}
.resumo h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.resumo ul{margin:.3em 0 .4em;max-width:none}
.resumo li{margin:.25em 0}

/* Blocos */
.callout{border-left:4px solid var(--accent);background:var(--tint);padding:12px 16px;margin:1.2em 0;border-radius:0 12px 12px 0}
.callout p{margin:.3em 0}
.callout b{display:block;margin-bottom:2px}
dl.terms{margin:1em 0;display:grid;gap:12px}
dl.terms div{padding-left:14px;border-left:2px solid var(--blue)}
dl.terms dt{font-weight:700}
dl.terms dd{margin:2px 0 0}
.sheet ol.steps,.sheet ul.toc,.sheet ul.subindex,.sheet ul.legend,.sheet ol.levels{max-width:none;padding-left:0}
ol.steps{list-style:none;counter-reset:st;margin:1em 0}
ol.steps > li{counter-increment:st;position:relative;padding:0 0 14px 46px;margin:0}
ol.steps > li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:linear-gradient(160deg,var(--blue),var(--blue-2));color:#fff}
ol.steps > li:not(:last-child)::after{content:"";position:absolute;left:15px;top:33px;bottom:2px;border-left:1.5px dashed var(--line-strong)}
ol.steps b{display:block}
.tbl{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line-soft);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
th{background:var(--tint);font-weight:700}
tr:last-child td{border-bottom:0}
.pairs{margin:1.2em 0;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
.pairs .row{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line-soft)}
.pairs .row:last-child{border-bottom:0}
.pairs .row > div{padding:10px 14px;font-size:.94rem}
.pairs .hd{background:var(--tint);font-weight:700}
.pairs .asis::before,.pairs .tobe::before{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.pairs .asis::before{content:"AS-IS"}
.pairs .tobe::before{content:"TO-BE"}
.pairs .hd > div::before{content:none}
@media (min-width:640px){
  .pairs .row{grid-template-columns:1fr 1fr}
  .pairs .row > div + div{border-left:1px solid var(--line-soft)}
  .pairs .asis::before,.pairs .tobe::before{content:none}
}
@media (max-width:639px){.pairs .hd{display:none}}

/* Diagramas: tela branca, como os desenhos exportados do Lucid */
figure{margin:1.4em 0}
.canvas{overflow-x:auto;border-radius:14px;background:#FFFFFF;padding:12px;border:1px solid var(--line-soft)}
.canvas svg{display:block;width:100%;height:auto}
.canvas.wide svg{min-width:1180px}
.canvas.mid svg{min-width:960px}
.canvas.sm svg{min-width:480px}
.plain-fig{overflow-x:auto}
.plain-fig svg{display:block;width:100%;height:auto;min-width:520px}
figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
svg text{font-family:var(--font)}
/* estilo Lucid (cores fixas) */
.lc-task{fill:url(#lcTask);stroke:#7E7E7E;stroke-width:1.2}
.lc-task.thick{stroke:#3a3a3a;stroke-width:3.2}
.lc-ev{fill:url(#lcBlue);stroke:#16357F;stroke-width:1.4}
.lc-ring{fill:none;stroke:#fff;stroke-width:1.3}
.lc-end{fill:#151515;stroke:#000;stroke-width:3}
.lc-gw{fill:url(#lcBlue);stroke:#16357F;stroke-width:1.2}
.lc-w{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lc-wthin{fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.lc-ic{fill:none;stroke:#1d1d1d;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.lc-icf{fill:#1d1d1d}
.lc-icinv{fill:none;stroke:#EDEDED;stroke-width:1.2;stroke-linejoin:round}
.lc-gear{fill:none;stroke:#1d1d1d;stroke-width:2.8;stroke-dasharray:2.1 1.7}
.lc-t{fill:#1d1d1d;font-size:11.5px}
.lc-lbl{fill:#454545;font-size:10.5px}
.lc-flow{fill:none;stroke:#1d1d1d;stroke-width:1.3}
.lc-msg{fill:none;stroke:#1d1d1d;stroke-width:1.2;stroke-dasharray:5 4}
.lc-assoc{fill:none;stroke:#1d1d1d;stroke-width:1.2;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.lc-open{fill:#fff;stroke:#1d1d1d;stroke-width:1.2}
.lc-pool{fill:#fff;stroke:#3a3a3a;stroke-width:1.4}
.lc-band{fill:#1E24F0}
.lc-band-t{fill:#fff;font-size:12px;font-weight:600}
.lc-lane{stroke:#9aa0b8;stroke-width:1}
.lc-note{fill:none;stroke:#8a8a8a;stroke-width:1;stroke-dasharray:4 3}
.lc-note-t{fill:#555;font-size:10px}
.lc-title{fill:#3b3b3b}
.lc-title-t{fill:#fff;font-size:12px}
.lc-doc{fill:url(#lcTask);stroke:#7E7E7E;stroke-width:1.2}
.lc-link{fill:#F8CDF1;stroke:#D25CC6;stroke-width:1.8}
.lc-link-ring{fill:none;stroke:#D25CC6;stroke-width:1}
.lc-link-in{fill:#111}
.lc-link-out{fill:#fff;stroke:#222;stroke-width:1.1;stroke-linejoin:round}
.ok-badge{fill:#6CC06A}.no-badge{fill:#D8352A}
.lc-group{fill:none;stroke:#555;stroke-width:1.2;stroke-dasharray:8 3 2 3}
.mk circle{fill:#EAC200;stroke:#00031B;stroke-width:1}
.mk text{fill:#00031B;font-size:12px;font-weight:700}
/* estilo do tema (diagramas conceituais) */
.t-box{fill:var(--panel-solid);stroke:var(--line-strong);stroke-width:1.2}
.t-col{fill:var(--tint)}
.t-sep{stroke:var(--line-soft);stroke-width:1}
.t-line{fill:none;stroke:var(--line-strong);stroke-width:1.3}
.t-t{fill:var(--ink);font-size:12px}
.t-tb{fill:var(--ink);font-size:12px;font-weight:600}
.t-lbl{fill:var(--muted);font-size:11px}
.t-flow{fill:none;stroke:var(--ink);stroke-width:1.4}
.t-acc{fill:none;stroke:var(--accent);stroke-width:2.4}
.t-dot{fill:var(--panel-solid);stroke:var(--accent);stroke-width:2.4}
.t-ev{fill:none;stroke:var(--ink);stroke-width:1.6}
.t-evend{fill:none;stroke:var(--ink);stroke-width:3.6}
.t-gw{fill:none;stroke:var(--ink);stroke-width:1.4}
.t-x{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.t-task{fill:var(--tint);stroke:var(--line-strong);stroke-width:1.2}
.arrow-ink{fill:var(--ink)}
.arrow-acc{fill:var(--accent)}

.legend{list-style:none;margin:1em 0;display:grid;gap:10px}
.legend li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin:0}
.legend .mkr{width:24px;height:24px;border-radius:50%;background:#EAC200;color:#00031B;display:grid;place-items:center;font-weight:700;font-size:.8rem;margin-top:1px}

/* Símbolos BPMN */
.syms{display:grid;grid-template-columns:1fr;gap:0;margin:1.2em 0;border-top:1px solid var(--line-soft)}
@media (min-width:760px){.syms{grid-template-columns:1fr 1fr;column-gap:28px}}
.sym{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.sym-fig{background:#fff;border-radius:12px;padding:4px}
.sym-fig svg{width:84px;height:60px;display:block}
.sym-fig .lc-t{font-size:10.5px}
.sym h4{font-size:.98rem;font-weight:700}
.sym p{margin:.2em 0 0 !important;font-size:.9rem;line-height:1.45;color:var(--muted)}

/* Hierarquia */
.levels{list-style:none;margin:1.2em 0}
.levels li{margin:0 0 6px;padding:10px 14px;border:1px solid var(--line-soft);border-left:4px solid var(--blue);border-radius:4px 12px 12px 4px;background:var(--tint)}
.levels li b{display:block}
.levels li span{font-size:.9rem;color:var(--muted)}
.levels li:nth-child(2){margin-left:4%}.levels li:nth-child(3){margin-left:8%}.levels li:nth-child(4){margin-left:12%}.levels li:nth-child(5){margin-left:16%}

/* Entrada, atividades, saída */
.ipo{display:grid;grid-template-columns:1fr;margin:1.2em 0}
.ipo > div{border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px}
.ipo > div b{display:block}
.ipo > div span{font-size:.9rem;color:var(--muted)}
.ipo .mid{background:linear-gradient(160deg,var(--blue),var(--blue-2));border-color:transparent;color:#fff}
.ipo .mid span{color:rgba(255,255,255,.85)}
.ipo .arr{border:0;height:22px;padding:0;display:grid;place-items:center;color:var(--muted)}
.ipo .arr svg{width:14px;height:14px;transform:rotate(90deg)}
@media (min-width:640px){
  .ipo{grid-template-columns:1fr 24px 1.3fr 24px 1fr}
  .ipo .arr{height:auto}
  .ipo .arr svg{transform:none}
}

/* Sub-índice */
.subindex{list-style:none;margin:1.2em 0;display:grid;gap:10px}
@media (min-width:640px){.subindex{grid-template-columns:1fr 1fr}}
.subindex a{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line-strong);border-radius:16px;text-decoration:none;color:var(--ink)}
.subindex a:hover{background:var(--tint)}
.subindex .fig{background:#fff;border-radius:10px;padding:2px}
.subindex svg{width:60px;height:42px;display:block}
.subindex b{display:block}
.subindex span{font-size:.86rem;color:var(--muted);line-height:1.35;display:block}
.subindex .seen-tag{color:var(--ok);font-weight:600;font-size:.78rem}

/* Campos do Notion */
.fields{margin:1.2em 0;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
.fields div{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.fields div:last-child{border-bottom:0}
.fields dt{font-weight:700}
.fields dd{margin:0;color:var(--muted);font-size:.93rem}
@media (min-width:640px){.fields div{grid-template-columns:170px 1fr;gap:14px}}

/* Acordeões */
details{border-bottom:1px solid var(--line-soft)}
details:first-of-type{border-top:1px solid var(--line-soft)}
summary{cursor:pointer;padding:12px 4px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:700;color:var(--muted);flex:none}
details[open] summary::after{content:"–"}
details > div{padding:0 4px 12px}
details > div p{margin:.2em 0 .6em}

/* Navegação entre módulos */
.pagenav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line-soft)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-strong);text-decoration:none;color:var(--ink);font-weight:650;cursor:pointer;line-height:1.25;background:transparent}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn small{display:block;font-weight:500;font-size:.74rem;opacity:.8}
.btn svg{width:16px;height:16px;flex:none}
.pagenav .next{margin-left:auto;text-align:right}

/* Capa */
.cover h1{font-size:clamp(2.8rem,10vw,5rem);margin:18px 0 14px}
.cover .lead{max-width:56ch}
.hero-flow{margin:4px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.hero-flow svg{width:100%;height:auto;display:block}
.hero-flow .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s ease forwards;animation-delay:var(--d)}
.hero-flow .pop{opacity:0;animation:pop .35s ease forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .hero-flow .draw{animation:none;stroke-dashoffset:0}
  .hero-flow .pop{animation:none;opacity:1}
  .index,.bar i{transition:none}
}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 8px}
.howto{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0 0}
@media (min-width:640px){.howto{grid-template-columns:1fr 1fr}}
.howto div{border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;background:var(--tint)}
.howto b{display:block;margin-bottom:2px}
.howto span{font-size:.9rem;color:var(--muted)}
.toc{list-style:none;margin:12px 0 0;display:grid;gap:10px}
@media (min-width:700px){.toc{grid-template-columns:1fr 1fr}}
.toc a{display:grid;grid-template-columns:1fr 20px;gap:6px;padding:14px 16px;border-radius:16px;border:1px solid var(--line-soft);text-decoration:none;color:var(--ink);height:100%}
.toc a:hover{background:linear-gradient(165deg,#001AFF,#002CAE 55%,#001450);color:#fff;border-color:transparent}
.toc a:hover span,.toc a:hover .n{color:rgba(255,255,255,.85)}
.toc .n{font-size:2rem;color:var(--link);display:block;margin-bottom:4px}
.toc b{display:block;line-height:1.25}
.toc span{font-size:.87rem;color:var(--muted);line-height:1.4;display:block;margin-top:3px}
.toc .ok{width:18px;height:18px;color:var(--ok);visibility:hidden}
.toc a.seen .ok{visibility:visible}
.sheet h2.plain{border-top:0;padding-top:0;margin-top:0}
.sheet h2.section-title{font-family:var(--display);font-stretch:64%;text-transform:uppercase;font-size:2rem;font-weight:700;line-height:1}
</style>
</head>

"use strict";

/* ---------- Construtores: símbolos no estilo Lucid ---------- */
const S = (vb, inner) => `<svg viewBox="${vb}" aria-hidden="true" focusable="false">${inner}</svg>`;
const pent = (cx, cy, r) => Array.from({length:5}, (_, k) => {
  const a = (-90 + 72*k) * Math.PI/180; return `${(cx + r*Math.cos(a)).toFixed(1)},${(cy + r*Math.sin(a)).toFixed(1)}`;
}).join(" ");

function evIcon(kind, cx, cy, r){
  if (kind === "timer") return `<circle class="lc-wthin" cx="${cx}" cy="${cy}" r="${r*.5}"/><path class="lc-wthin" d="M${cx} ${cy-r*.34}V${cy}L${cx+r*.26} ${cy+r*.14}"/>`;
  if (kind === "message"){ const w=r*1.0,h=r*.68,x=cx-w/2,y=cy-h/2; return `<rect class="lc-wthin" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="lc-wthin" d="M${x} ${y}L${cx} ${cy+h*.08}L${x+w} ${y}"/>`; }
  if (kind === "conditional"){ const w=r*.78,h=r*.98,x=cx-w/2,y=cy-h/2; return `<rect class="lc-wthin" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="lc-wthin" d="M${x+3} ${y+h*.3}H${x+w-3}M${x+3} ${y+h*.55}H${x+w-3}M${x+3} ${y+h*.8}H${x+w-3}"/>`; }
  if (kind === "multiple") return `<polygon class="lc-wthin" points="${pent(cx, cy+1, r*.5)}"/>`;

function ev(cx, cy, r, type, icon){
  let s;
  if (type === "end") s = `<circle class="lc-end" cx="${cx}" cy="${cy}" r="${r}"/>`;
  else if (type === "inter") s = `<circle class="lc-ev" cx="${cx}" cy="${cy}" r="${r}"/><circle class="lc-ring" cx="${cx}" cy="${cy}" r="${r-3.5}"/>`;
  else s = `<circle class="lc-ev" cx="${cx}" cy="${cy}" r="${r}"/>`;
  return s + (icon ? evIcon(icon, cx, cy, r) : "");
}
function gw(cx, cy, r, kind){
  let s = `<polygon class="lc-gw" points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}"/>`;
  const k = r*.34;
  if (kind === "x") s += `<path class="lc-w" d="M${cx-k} ${cy-k}L${cx+k} ${cy+k}M${cx+k} ${cy-k}L${cx-k} ${cy+k}"/>`;
  if (kind === "plus") s += `<path class="lc-w" d="M${cx} ${cy-k*1.3}V${cy+k*1.3}M${cx-k*1.3} ${cy}H${cx+k*1.3}"/>`;
  if (kind === "o") s += `<circle class="lc-w" cx="${cx}" cy="${cy}" r="${r*.4}"/>`;
  if (kind === "event") s += `<circle class="lc-wthin" cx="${cx}" cy="${cy}" r="${r*.5}"/><circle class="lc-wthin" cx="${cx}" cy="${cy}" r="${r*.4}"/><polygon class="lc-wthin" points="${pent(cx, cy+.5, r*.24)}"/>`;

function ic(name, x, y){

function tk(x, y, w, h, lines, icon, opts){
  opts = opts || {};
  const cx = x + w/2, cy = y + h/2, lh = 13.5;
  const shift = opts.sub || opts.loop ? -5 : (icon ? 3 : 0);
  const y0 = cy - (lines.length - 1) * lh/2 + 4 + shift;
  let s = `<rect class="lc-task${opts.thick ? " thick" : ""}" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>`;

  s += `<text class="lc-t" text-anchor="middle">${lines.map((l, i) => `<tspan x="${cx}" y="${y0 + i*lh}">${l}</tspan>`).join("")}</text>`;
  if (opts.sub){ const bx = cx - 6, by = y + h - 15; s += `<rect class="lc-ic" x="${bx}" y="${by}" width="12" height="11"/><path class="lc-ic" d="M${cx} ${by+2.5}v6M${cx-3} ${by+5.5}h6"/>`; }
  if (opts.loop){ const by = y + h - 8; s += `<path class="lc-ic" d="M${cx+4.5} ${by-2.5}a5 5 0 1 1 -2 -2.8"/><path class="lc-ic" d="M${cx+1} ${by-6.5}l1.8 1.3l-1.2 2"/>`; }

}
function doc(x, y, w, h){
  const f = w*.3;
  return `<path class="lc-doc" d="M${x} ${y}H${x+w-f}L${x+w} ${y+f}V${y+h}H${x}Z"/><path class="lc-ic" style="stroke:#7E7E7E" d="M${x+w-f} ${y}V${y+f}H${x+w}"/>`;

function tunnel(cx, cy, r, entrada){
  const w = r*1.1, h = r*.78, x0 = cx - w/2, xm = x0 + w*.55;
  let s = `<circle class="lc-link" cx="${cx}" cy="${cy}" r="${r}"/><circle class="lc-link-ring" cx="${cx}" cy="${cy}" r="${r-3}"/>`;
  s += `<path class="${entrada ? "lc-link-in" : "lc-link-out"}" d="M${x0} ${cy-h*.24}H${xm}V${cy-h/2}L${x0+w} ${cy}L${xm} ${cy+h/2}V${cy+h*.24}H${x0}Z"/>`;

}
const F = d => `<path class="lc-flow" marker-end="url(#lcArrow)" d="${d}"/>`;
const mark = (n, x, y) => `<g class="mk"><circle cx="${x}" cy="${y}" r="10"/><text x="${x}" y="${y+4}" text-anchor="middle">${n}</text></g>`;
const lbl = (x, y, lines, anchor) => `<text class="lc-lbl" text-anchor="${anchor||"middle"}">${[].concat(lines).map((l, i) => `<tspan x="${x}" y="${y + i*12.5}">${l}</tspan>`).join("")}</text>`;
const vtext = (x, y, t, cls) => `<text class="${cls}" text-anchor="middle" transform="translate(${x} ${y}) rotate(-90)">${t}</text>`;
// anotação: colchete tracejado com texto, ligado ao elemento por associação pontilhada
function note(bx, by, h, lines, from){
  let s = `<path class="lc-note" d="M${bx+8} ${by}H${bx}V${by+h}H${bx+8}"/>`;
  s += `<text class="lc-note-t">${lines.map((l, i) => `<tspan x="${bx+6}" y="${by + 11 + i*11.5}">${l}</tspan>`).join("")}</text>`;
  if (from) s += `<path class="lc-assoc" d="M${from[0]} ${from[1]}L${bx} ${by + h/2}"/>`;
  return s;
}
// piscina com título e raias (faixas azuis, como no Lucid)
function pool(W, top, title, lanes){
  const H = lanes.reduce((a, l) => a + l.h, 0);
  const tw = title.length * 6.6 + 24;
  let s = `<rect class="lc-title" x="1" y="1" width="${tw}" height="24" rx="3"/><text class="lc-title-t" x="${1 + tw/2}" y="17" text-anchor="middle">${title}</text>`;
  s += `<rect class="lc-pool" x="1" y="${top}" width="${W-2}" height="${H}" rx="6"/>`;
  let y = top;
  lanes.forEach((ln, i) => {
    s += `<rect class="lc-band" x="1.7" y="${y + (i === 0 ? .7 : 0)}" width="28" height="${ln.h - (i === 0 ? .7 : 0) - (i === lanes.length - 1 ? .7 : 0)}" ${i === 0 ? 'rx="5"' : ""}/>`;
    s += vtext(17, y + ln.h/2 + 4, ln.name, "lc-band-t");
    if (i > 0) s += `<path class="lc-lane" d="M1 ${y}H${W-1}"/>`;
    y += ln.h;
  });
  return s;
}

  html:`
<p class="lead">Toda empresa tem processos, estejam eles escritos ou não. A diferença está em onde eles ficam guardados: na cabeça de algumas pessoas ou em uma documentação que qualquer um consegue consultar.</p>
<p>Quando o jeito certo de fazer uma tarefa depende de quem está na função, a empresa não tem um processo definido. Ela tem uma dependência de pessoas. Férias, desligamentos ou um aumento de demanda expõem essa fragilidade rapidamente.</p>
<h2>O custo da desorganização</h2>
<p>Levantamentos da IDC (International Data Corporation) apontam que empresas perdem entre 20% e 30% da receita anual com ineficiências e falhas em processos operacionais. Um estudo da McKinsey indica que colaboradores gastam cerca de 20% da semana de trabalho procurando informações internas ou tentando entender como executar uma tarefa, tempo que não gera valor para o cliente.</p>
<h2>O que a padronização traz</h2>
<dl class="terms">
<div><dt>Previsibilidade e controle de custos</dt><dd>Com os fluxos documentados, a gestão conhece o tempo real das entregas e onde os recursos são consumidos.</dd></div>
<div><dt>Menos retrabalho e desperdício</dt><dd>O processo padronizado funciona como barreira contra erros recorrentes e etapas desnecessárias.</dd></div>
<div><dt>Crescimento sem perda de controle</dt><dd>Uma operação só cresce com segurança quando pode ser replicada sem supervisão constante.</dd></div>
<div><dt>Treinamento mais rápido</dt><dd>O mapa do processo vira um guia visual para quem chega, reduzindo o tempo até a pessoa ganhar autonomia.</dd></div>
</dl>
<div class="callout"><b>Um caso clássico</b><p>O McDonald's não se expandiu por ter os cozinheiros mais experientes, e sim por desenhar em detalhe cada posição de equipamento, tempo de preparo e ordem de montagem (o Speedee Service System). Um colaborador novo aprende a operação rápido e entrega o mesmo padrão em qualquer unidade.</p></div>
<p>O mapeamento de processos é o primeiro passo nesse caminho: tirar o trabalho da cabeça das pessoas e transformá-lo em conhecimento da organização, disponível para consulta, análise e melhoria.</p>`},

{ id:"processo", title:"O que é um processo", time:5,
  scope:"Definição, elementos que todo processo tem e os níveis de detalhe usados no mapeamento.",
  resumo:["Processo é uma sequência de atividades que transforma uma entrada em um resultado.","Todo processo tem gatilho, sequência, responsáveis, decisões e um fim definido.","Processos podem ser vistos em níveis, do macroprocesso até a tarefa."],
  html:`
<p class="lead">Um processo é uma sequência estruturada de atividades que transforma uma entrada, como um pedido ou uma informação, em uma entrega de valor para um cliente interno ou externo.</p>
<div class="ipo" role="group" aria-label="Exemplo de processo: entrada, atividades e saída">
  <div><b>Entrada</b><span>Uma área da empresa solicita a compra de um item</span></div>
  <div class="arr" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M1 7h11M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>
  <div class="mid"><b>Atividades</b><span>Cotar com fornecedores, aprovar a compra, emitir o pedido, receber o item</span></div>
  <div class="arr" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M1 7h11M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>
  <div><b>Saída</b><span>Item entregue à área solicitante, no prazo e na quantidade certa</span></div>
</div>
<p>Um exemplo do cotidiano ajuda a fixar a ideia: na entrega de uma pizza, o cliente faz o pedido (início), a cozinha prepara, o entregador leva até o endereço e o processo termina quando o cliente recebe o produto (fim). Cada etapa tem um responsável claro.</p>
<h2>Elementos de todo processo</h2>
<dl class="terms">
<div><dt>Gatilho</dt><dd>O acontecimento que dá início à rotina: a chegada de um e-mail, uma solicitação no sistema, uma data do mês.</dd></div>
<div><dt>Sequência de atividades</dt><dd>As ações executadas, em ordem, incluindo os sistemas, planilhas e documentos consultados.</dd></div>
<div><dt>Responsáveis</dt><dd>O cargo ou a área que executa cada atividade.</dd></div>
<div><dt>Decisões e exceções</dt><dd>Os pontos em que o caminho se divide: o que acontece quando falta um documento, quando um valor passa do limite ou quando algo foge do padrão.</dd></div>
<div><dt>Critério de conclusão</dt><dd>O marco que define que o processo terminou e entregou o seu resultado.</dd></div>
</dl>
<h2>Níveis de detalhe</h2>
<p>Processos podem ser olhados de mais longe ou de mais perto. A hierarquia abaixo organiza esses níveis, do mais amplo para o mais específico:</p>
<ol class="levels">
<li><b>Macroprocesso</b><span>Grande conjunto de processos ligados a uma função da empresa. Ex.: Gestão financeira.</span></li>
<li><b>Processo</b><span>Sequência com início, meio e fim que entrega um resultado. Ex.: Contas a pagar.</span></li>
<li><b>Subprocesso</b><span>Parte de um processo com lógica própria. Ex.: Cadastro de fornecedor.</span></li>
<li><b>Atividade</b><span>Ação executada dentro do subprocesso. Ex.: Registrar os dados do fornecedor.</span></li>
<li><b>Tarefa</b><span>O menor nível, que não se divide mais. Ex.: Preencher o CNPJ no sistema.</span></li>
</ol>
<div class="callout"><b>Qual nível usar</b><p>Nem todo mapeamento desce até a tarefa. Para enxergar a empresa como um todo, os macroprocessos bastam. Para treinar alguém em uma rotina ou encontrar a origem de um problema, é preciso chegar às atividades e tarefas.</p></div>`},

{ id:"organograma", title:"Processos e organograma", time:4,
  scope:"Como a estrutura da empresa se relaciona com os fluxos de trabalho.",
  resumo:["O organograma mostra quem é quem; o mapa de processos mostra como o trabalho flui.","Processos atravessam áreas, e os problemas costumam surgir nas passagens entre elas.","As raias dos fluxogramas e os cargos do Guia Prático ligam os dois."],
  html:`
<p class="lead">O organograma e o mapa de processos descrevem a mesma empresa por ângulos diferentes. Um mostra como ela está organizada; o outro, como o trabalho de fato acontece.</p>
<div class="tbl"><table>
<thead><tr><th></th><th>Organograma</th><th>Mapa de processos</th></tr></thead>
<tbody>
<tr><td><b>Responde</b></td><td>Quem é quem e quem responde a quem</td><td>O que é feito, em que ordem e por quem</td></tr>
<tr><td><b>Leitura</b></td><td>Vertical, por hierarquia</td><td>Horizontal, do início ao fim do fluxo</td></tr>
<tr><td><b>Unidade</b></td><td>Setores, cargos e pessoas</td><td>Atividades, decisões e entregas</td></tr>
<tr><td><b>Serve para</b></td><td>Localizar responsáveis e linhas de reporte</td><td>Entender, padronizar e melhorar o trabalho</td></tr>
</tbody></table></div>
<h2>Visão funcional e visão por processos</h2>
<p>Na visão funcional, cada área cuida da sua parte. Na visão por processos, o trabalho é enxergado como um fluxo que atravessa várias áreas até chegar ao resultado.</p>
<figure><div class="plain-fig">${D_ORG}</div>
<figcaption>O organograma organiza as áreas em colunas. O processo de compra corre na horizontal, passando por quatro delas.</figcaption></figure>
<p>É justamente nas passagens de uma área para outra que os problemas costumam aparecer: informação que chega incompleta, tarefa que fica parada esperando alguém, responsabilidade que ninguém assume. Por isso o mapeamento olha para o fluxo inteiro, e não só para cada área isolada.</p>
<h2>Como ler um organograma</h2>
<dl class="terms">
<div><dt>Níveis</dt><dd>De cima para baixo: diretoria, setores e cargos. Quanto mais alto, maior a abrangência de decisão.</dd></div>
<div><dt>Linhas</dt><dd>Indicam a quem cada setor ou cargo responde.</dd></div>
<div><dt>Legenda</dt><dd>Diferencia os tipos de elemento, como setores, diretoria, colaboradores e terceirizados. Parceiros externos também podem aparecer, porque participam de processos da empresa.</dd></div>
</dl>
<h2>Como os dois se conectam</h2>
<dl class="terms">
<div><dt>As raias vêm do organograma</dt><dd>No desenho em BPMN, cada raia representa um cargo ou uma área. Os nomes usados nas raias devem bater com os do organograma.</dd></div>
<div><dt>Todo processo tem um responsável</dt><dd>Mesmo passando por várias áreas, cada processo tem um cargo responsável principal por ele.</dd></div>
<div><dt>No Guia Prático, os cargos fazem a ponte</dt><dd>A visualização por cargos mostra os processos de cada função, e o campo Setor liga cada processo à sua área no organograma.</dd></div>
</dl>`},

{ id:"mapeamento", title:"Mapeamento de processos", time:5,
  scope:"O que é mapear, o que o mapa precisa mostrar e como as informações são levantadas.",
  resumo:["O mapa mostra gatilho, sequência, responsáveis e decisões de um processo.","Ele é construído com quem executa o trabalho e validado por essa pessoa.","Retrata a prática real, não o ideal, e não é uma avaliação de desempenho."],
  html:`
<p class="lead">Mapear um processo é construir uma representação visual do seu passo a passo, mostrando quem executa cada atividade e em que ordem ela acontece.</p>
<p>Um bom mapa deixa evidentes quatro coisas:</p>
<ul>
<li>o gatilho que inicia a rotina;</li>
<li>a sequência cronológica das tarefas;</li>
<li>os responsáveis por cada ação, sejam cargos ou áreas;</li>
<li>as decisões e exceções que aparecem no meio do caminho.</li>
</ul>
<h2>Para que serve</h2>
<ul>
<li>Identificar oportunidades de melhoria e gargalos.</li>
<li>Padronizar a forma como as atividades são realizadas.</li>
<li>Facilitar o treinamento de novos colaboradores.</li>
<li>Criar uma base de consulta clara sobre como cada processo funciona.</li>
</ul>
<h2>Como as informações são levantadas</h2>
<p>O mapa não é feito a partir de suposições da gestão. Ele é construído com base em conversas guiadas com quem executa a tarefa no dia a dia, cobrindo estes pontos:</p>
<ol class="steps">
<li><b>Nome e objetivo do processo</b>Qual é a finalidade principal dessa rotina?</li>
<li><b>Gatilho de início</b>O que faz o processo começar?</li>
<li><b>Passo a passo</b>Quais ações são feitas, em qual ordem, e quais sistemas ou planilhas são usados?</li>
<li><b>Decisões e exceções</b>O que acontece quando falta um documento ou algo foge do padrão?</li>
<li><b>Responsáveis</b>Quem executa cada tarefa? Essa resposta define as raias do desenho.</li>
<li><b>Critério de conclusão</b>Qual é o marco que indica que o processo terminou?</li>
</ol>
<div class="callout"><b>Princípio central</b><p>Mapeie o processo como ele acontece de fato, e não como deveria acontecer. Exceções, desvios e travas fazem parte do retrato real e não devem ser omitidos.</p></div>
<p>O mapeamento também não é uma avaliação de desempenho de quem executa o processo. O objetivo é retratar a prática, incluindo as dificuldades, porque são elas que apontam onde melhorar.</p>
<h2>Do levantamento à documentação</h2>
<ol class="steps">
<li><b>Levantamento</b>Conversas com quem executa o processo.</li>
<li><b>Desenho</b>O fluxo é representado em BPMN.</li>
<li><b>Validação</b>Quem executa confere se o desenho corresponde à realidade.</li>
<li><b>Documentação</b>O desenho validado passa a fazer parte da documentação oficial do processo.</li>
</ol>`},

{ id:"as-is-to-be", title:"AS-IS e TO-BE", time:6,
  scope:"O retrato do processo atual, os sinais de problema e como se constrói a versão melhorada.",
  resumo:["AS-IS é o diagnóstico de como o processo funciona hoje; TO-BE é a proposta de melhoria.","Os principais sinais de problema são gargalo, retrabalho, redundância, etapas manuais e espera.","Um TO-BE só vale na prática depois de implementado."],
  html:`
<p class="lead">O AS-IS é o diagnóstico de como o processo funciona hoje. O TO-BE é o desenho de como ele deve passar a funcionar. Um depende do outro: não dá para projetar a melhoria sem antes conhecer a realidade.</p>
<div class="tbl"><table>
<thead><tr><th></th><th>AS-IS (como é)</th><th>TO-BE (como será)</th></tr></thead>
<tbody>
<tr><td><b>Representa</b></td><td>O retrato fiel de como o trabalho acontece atualmente</td><td>A versão futura, planejada e otimizada do processo</td></tr>
<tr><td><b>Objetivo</b></td><td>Evidenciar gargalos, retrabalho, burocracia e etapas manuais</td><td>Eliminar desperdícios, padronizar e automatizar</td></tr>
<tr><td><b>Serve de</b></td><td>Base para o redesenho</td><td>Direção para as ações de melhoria</td></tr>
</tbody></table></div>
<p>Muitas iniciativas de melhoria falham porque tentam desenhar o processo ideal sem estudar a operação atual. O AS-IS evita esse erro.</p>
<h2>Sinais de problema no AS-IS</h2>
<dl class="terms">
<div><dt>Gargalo</dt><dd>Etapa que limita o ritmo do processo inteiro, onde o trabalho se acumula.</dd></div>
<div><dt>Retrabalho</dt><dd>Atividade feita de novo por erro, falta de informação ou devolução. No desenho, aparece como um retorno a uma etapa anterior, feito por um par de túneis.</dd></div>
<div><dt>Redundância</dt><dd>Etapas repetidas ou aprovações que não agregam valor, como a mesma conferência feita por duas pessoas.</dd></div>
<div><dt>Etapa manual</dt><dd>Cálculos, digitação ou conferências feitos à mão quando poderiam ser automáticos. No desenho, aparecem como tarefas manuais ou sequências longas de preenchimento.</dd></div>
<div><dt>Espera</dt><dd>Tempo em que nada acontece porque o processo aguarda uma resposta, assinatura ou documento.</dd></div>
<div><dt>Dependência de pessoa</dt><dd>Etapa que só uma pessoa sabe executar.</dd></div>
</dl>
<h2>O redesenho</h2>
<p>Com o AS-IS em mãos, a análise costuma revelar etapas desnecessárias, retrabalho ou falta de padronização. O redesenho propõe uma nova versão do processo, mais enxuta e organizada, que corrige esses problemas. Essa nova versão é o TO-BE.</p>
<dl class="terms">
<div><dt>Eliminar redundâncias</dt><dd>Se uma aprovação passa por quatro pessoas em sequência sem agregar valor, simplifique para alçadas claras ou aprovações em paralelo.</dd></div>
<div><dt>Automatizar etapas manuais</dt><dd>Substituir conferências e cálculos pontuais por formulários padronizados e validações no sistema.</dd></div>
<div><dt>Centralizar informações</dt><dd>Reduzir documentos soltos por e-mail ou mensagem, reunindo tudo já no início da solicitação.</dd></div>
</dl>
<h2>Exemplo: reembolso de despesas</h2>
<div class="pairs">
<div class="row hd"><div>AS-IS</div><div>TO-BE</div></div>
<div class="row"><div class="asis">Colaborador envia recibos soltos, gerando conferência manual e retrabalho quando falta algum documento.</div><div class="tobe">Documentos chegam anexados e completos junto com a solicitação.</div></div>
<div class="row"><div class="asis">Analista calcula o valor do reembolso manualmente, item por item.</div><div class="tobe">O valor total já vem calculado na solicitação.</div></div>
<div class="row"><div class="asis">A solicitação é registrada manualmente no sistema depois da análise.</div><div class="tobe">A solicitação já nasce registrada no sistema.</div></div>
<div class="row"><div class="asis">A documentação é arquivada manualmente ao final.</div><div class="tobe">Os documentos ficam vinculados à solicitação desde o início.</div></div>
</div>
<div class="callout"><b>Um TO-BE ainda não é realidade</b><p>O TO-BE representa o processo desejado, que ainda precisa ser implementado. Até lá, o AS-IS continua sendo a descrição de como o trabalho acontece.</p></div>
<p>No módulo 07 você encontra esse mesmo exemplo desenhado em BPMN, nas versões AS-IS e TO-BE.</p>`},

{ id:"bpmn", title:"Notação BPMN 2.0", time:3,
  scope:"A linguagem visual usada nos fluxogramas e os seus blocos essenciais.",
  resumo:["BPMN é uma linguagem visual padronizada: cada forma tem um significado fixo.","Cinco formas básicas bastam para ler a maior parte dos fluxogramas.","Os submódulos detalham cada grupo de símbolos."],
  html:`
<p class="lead">BPMN (Business Process Model and Notation) é uma linguagem visual padronizada para desenhar fluxos de trabalho. Ela funciona como um idioma comum: da diretoria à operação, qualquer pessoa olha para o mesmo diagrama e entende como o trabalho acontece e quem é responsável por cada entrega.</p>
<p>Sem um padrão, cada um desenha e interpreta fluxos do seu jeito. Com o BPMN, cada forma tem um significado fixo. A versão atual da notação é a 2.0.</p>
<div class="callout"><b>Não é preciso decorar tudo</b><p>Na prática, cinco formas cobrem a maior parte dos desenhos: o círculo (evento), o retângulo arredondado (tarefa), o losango (decisão), a seta (fluxo) e as faixas horizontais (raias). Os demais símbolos refinam o significado dessas formas.</p></div>
<p>Os símbolos deste manual seguem o mesmo estilo visual dos fluxogramas do Guia Prático, desenhados no Lucid.</p>
<h2>Os blocos da notação</h2>
<p>Cada bloco tem uma página própria com os símbolos e o que eles significam:</p>`,
  subs:[
  { id:"raias", title:"Piscinas e raias", desc:"Quem faz o quê.", icon:SYM.lanes,
    html:`
<p class="lead">Antes de olhar para as tarefas, o desenho delimita as responsabilidades. É isso que piscinas e raias fazem.</p>
<div class="syms">
${sym(SYM.title,"Nome do processo","Nos fluxogramas do Guia Prático, o nome do processo aparece em uma caixa escura acima do desenho.")}
${sym(SYM.pool,"Piscina (pool)","A moldura que contém o processo completo, de ponta a ponta.")}
${sym(SYM.lanes,"Raia (lane)","Divisão dentro da piscina, identificada pela faixa azul à esquerda. Cada raia é um cargo ou área, e toda tarefa dentro dela é responsabilidade desse participante.")}
</div>
<figure><div class="canvas sm">${D_LANES}</div><figcaption>Quando o fluxo muda de raia, o trabalho passa de uma área para outra.</figcaption></figure>
<h2>Como ler</h2>
<ul>
<li>Leia o nome de cada raia antes de seguir o fluxo: ele diz quem faz cada etapa.</li>
<li>Um processo executado por um único cargo tem uma só raia.</li>
<li>Toda vez que uma seta cruza de uma raia para outra, há uma passagem de responsabilidade. Esses pontos merecem atenção na análise.</li>
<li>As raias usam nomes de cargos ou áreas, e não nomes de pessoas, para que o desenho continue válido quando a equipe mudar.</li>
</ul>`},
  { id:"eventos", title:"Eventos e túneis", desc:"O que acontece no fluxo: início, meio, fim e as ligações entre partes do desenho.", icon:SYM.evStart,
    html:`
<p class="lead">Eventos são representados por círculos e marcam acontecimentos que afetam o processo. Nos fluxogramas do Guia Prático, o início e os eventos intermediários aparecem em azul, o fim aparece em preto e os túneis aparecem em rosa.</p>
<div class="syms">
${sym(SYM.evStart,"Evento inicial","Círculo azul de borda simples. É o gatilho que dá início ao processo, como a chegada de uma nova solicitação.")}
${sym(SYM.evInter,"Evento intermediário","Círculo com borda dupla. Algo que ocorre entre o início e o fim, como aguardar a confirmação de um pagamento.")}
${sym(SYM.evEnd,"Evento final","Círculo preto de borda grossa. Marca a conclusão do processo.")}
</div>
<h2>Tipos de evento</h2>
<p>Um ícone dentro do círculo indica o que dispara o evento. Os mesmos ícones podem aparecer em eventos iniciais, intermediários ou finais.</p>
<div class="syms">
${sym(SYM.evTimer,"Temporizador","Uma data, um prazo ou uma recorrência. Ex.: todo dia 5 do mês; aguardar 48 horas.")}
${sym(SYM.evMsg,"Mensagem","O processo começa, continua ou termina com a chegada ou o envio de uma mensagem, como um e-mail.")}
${sym(SYM.evCond,"Condicional","O processo começa ou segue quando uma condição ou regra de negócio é atendida. Ex.: estoque abaixo do mínimo.")}
${sym(SYM.evMulti,"Múltiplo","Mais de um acontecimento diferente pode disparar o processo.")}
</div>
<h2>Túneis</h2>
<p>Túneis são eventos intermediários do tipo link, desenhados em rosa. Eles ligam dois pontos do mesmo processo sem uma seta entre eles. São usados quando o caminho precisa voltar a uma etapa anterior ou saltar para outra parte do desenho.</p>
<div class="syms">
${sym(SYM.tunIn,"Túnel de entrada","Seta preta. Marca o ponto em que o fluxo entra no túnel e deixa aquela parte do desenho.")}
${sym(SYM.tunOut,"Túnel de saída","Seta branca. Marca o ponto em que o fluxo reaparece e continua.")}
</div>
<p>Os dois túneis de um par são identificados pelo mesmo nome, como "A", para que o leitor saiba onde o caminho continua. Nos fluxogramas do Guia Prático, sempre que um caminho volta a uma etapa anterior, esse retorno aparece como um par de túneis.</p>
<figure><div class="canvas sm">${D_TUNEL_PAR}</div><figcaption>Se o documento não estiver completo, a correção é solicitada e o fluxo passa pelo túnel de entrada A. A leitura continua no túnel de saída A, antes da conferência, e o processo recomeça dali.</figcaption></figure>
`},
  { id:"atividades", title:"Atividades e tarefas", desc:"O que é executado.", icon:SYM.task,
    html:`
<p class="lead">Atividades são representadas por retângulos de cantos arredondados. São as ações práticas do dia a dia.</p>
<div class="syms">
${sym(SYM.task,"Tarefa","O nível mais básico de atividade, que não é subdividido no desenho.")}
${sym(SYM.sub,"Subprocesso","Um grupo de tarefas reunido em uma única forma. O sinal de + indica que existe um detalhamento separado.")}
${sym(SYM.call,"Atividade de chamada","Borda grossa. Aciona um processo que já existe e é reutilizado em vários pontos.")}
${sym(SYM.loop,"Loop","Tarefa que se repete até que uma condição seja atendida.")}
</div>
<h2>Tipos de tarefa</h2>
<p>O ícone no canto superior esquerdo diz como a tarefa é executada:</p>
<div class="syms">
${sym(SYM.taskUser,"Usuário","Executada por uma pessoa com apoio de um sistema. Ex.: preencher um cadastro na plataforma da empresa. É o tipo mais comum em processos administrativos.")}
${sym(SYM.taskManual,"Manual","Executada no mundo físico, sem sistema. Ex.: juntar documentos impressos, conferir um material recebido.")}
${sym(SYM.taskService,"Serviço","Executada automaticamente por um sistema, sem intervenção humana.")}
${sym(SYM.taskSend,"Enviar","Tarefa em que se envia uma mensagem, como um e-mail ou uma notificação.")}
${sym(SYM.taskReceive,"Receber","Tarefa em que se recebe uma mensagem.")}
</div>
<div class="callout"><b>Como as tarefas são nomeadas</b><p>Verbo no infinitivo seguido do objeto: "Conferir documentos", "Emitir pedido de compra". O nome descreve a ação, nunca a pessoa que a executa. Detalhes como o campo a preencher ou o botão a clicar ficam nas anotações.</p></div>`},
  { id:"gateways", title:"Gateways", desc:"Decisões e caminhos.", icon:SYM.gwX,
    html:`
<p class="lead">Gateways são losangos que controlam por onde o fluxo segue. Eles dividem o caminho em mais de um e também reúnem caminhos que se separaram.</p>
<div class="syms">
${sym(SYM.gwX,"Exclusivo (X)","Só um caminho pode ser seguido. Ex.: \"O fornecedor está cadastrado?\" Sim ou não. É o gateway mais comum.")}
${sym(SYM.gwPlus,"Paralelo (+)","Dispara dois ou mais caminhos ao mesmo tempo, sem escolha. Na junção, espera todos terminarem.")}
${sym(SYM.gwO,"Inclusivo (O)","Um ou mais caminhos podem ser seguidos, conforme as condições atendidas.")}
${sym(SYM.gwEv,"Baseado em evento","O caminho depende de qual evento acontece primeiro. Ex.: a resposta do fornecedor chega ou o prazo expira.")}
</div>
<h2>Como ler</h2>
<ul>
<li>No gateway exclusivo, a pergunta fica ao lado do losango, e cada saída traz a resposta correspondente ("Sim", "Não", "Acima de R$ 5 mil").</li>
<li>Todo gateway aparece em par: um losango abre os caminhos e outro, sem pergunta, os reúne. Depois dele, o fluxo segue em uma única linha.</li>
<li>Quando um caminho precisa voltar a uma etapa anterior, o desenho usa um par de túneis, e não uma seta de retorno. No AS-IS, esse retorno quase sempre indica retrabalho.</li>
</ul>`},
  { id:"conectores", title:"Conectores", desc:"Como os elementos se ligam.", icon:SYM.seq,
    html:`
<p class="lead">Conectores são as linhas que ligam os elementos do desenho. O tipo de linha muda o significado.</p>
<div class="syms">
${sym(SYM.seq,"Fluxo de sequência","Linha contínua com seta cheia. Indica a ordem em que as atividades acontecem. É o conector principal do desenho.")}
${sym(SYM.msg,"Fluxo de mensagem","Linha tracejada com um círculo na origem e seta vazada. Representa a troca de mensagens entre participantes diferentes, como a empresa e um fornecedor.")}
${sym(SYM.assoc,"Associação","Linha pontilhada. Liga anotações, documentos e dados aos elementos do fluxo.")}
</div>
<div class="callout"><b>Processos longos</b><p>Quando um processo não cabe em uma linha, o fluxo de sequência desce e continua na linha de baixo, da esquerda para a direita. Basta seguir a seta.</p></div>`},
  { id:"artefatos", title:"Dados e artefatos", desc:"Documentos, sistemas e anotações.", icon:SYM.note,
    html:`
<p class="lead">Artefatos acrescentam informação ao desenho sem alterar o fluxo: documentos usados, dados armazenados e observações.</p>
<div class="syms">
${sym(SYM.note,"Anotação","Colchete tracejado com um texto explicativo. Nos fluxogramas do Guia Prático, é o artefato mais usado: registra o sistema acessado, o campo a preencher, o documento envolvido ou uma regra da tarefa.")}
${sym(SYM.data,"Objeto de dados","Um documento ou informação usado no processo, como uma nota fiscal ou uma planilha.")}
${sym(SYM.dataIn,"Entrada de dados","Informação de que as tarefas dependem para começar.")}
${sym(SYM.dataOut,"Saída de dados","Informação produzida como resultado do processo.")}
${sym(SYM.coll,"Coleção de dados","Um conjunto de documentos do mesmo tipo, como uma lista de orçamentos.")}
${sym(SYM.store,"Armazenamento de dados","Onde as informações ficam guardadas e são consultadas: um sistema, um banco de dados, uma pasta compartilhada.")}
${sym(SYM.group,"Grupo","Destaca visualmente um conjunto de elementos relacionados, sem mudar o fluxo.")}
</div>`}
  ]},

{ id:"leitura", title:"Como ler um fluxograma", time:6,
  scope:"Um roteiro de leitura e o exemplo do reembolso de despesas nas versões AS-IS e TO-BE.",
  resumo:["Leia nesta ordem: nome, raias, início, setas, losangos, anotações e fim.","As anotações trazem os detalhes de execução, como sistema, campo e documento.","Retornos por túneis e tarefas manuais são os primeiros pontos a observar."],
  html:`
<p class="lead">Um fluxograma em BPMN é lido como um mapa: primeiro você se localiza, depois segue o caminho. Este roteiro funciona para qualquer processo do Guia Prático.</p>
<ol class="steps">
<li><b>Leia o nome do processo</b>Ele fica na caixa escura acima do desenho.</li>
<li><b>Identifique os participantes</b>Leia o nome de cada raia, na faixa azul à esquerda.</li>
<li><b>Encontre o início</b>Procure o círculo azul. O texto abaixo dele diz o que dispara o processo.</li>
<li><b>Siga as setas</b>Percorra as tarefas na ordem das setas contínuas. Em processos longos, o fluxo continua na linha de baixo. Se o caminho chegar a um túnel de entrada, continue no túnel de saída com o mesmo nome.</li>
<li><b>Pare em cada losango</b>Leia a pergunta e siga cada caminho até o losango que fecha a decisão.</li>
<li><b>Leia as anotações</b>Os colchetes tracejados explicam detalhes de cada tarefa.</li>
<li><b>Chegue ao fim</b>O círculo preto marca a conclusão do processo.</li>
</ol>
<h2>Exemplo AS-IS: reembolso de despesas</h2>
<figure><div class="canvas wide">${D_ASIS}</div><figcaption>Arraste para o lado para ver o desenho completo. Os números indicam os pontos comentados abaixo.</figcaption></figure>
<ul class="legend">
<li><span class="mkr">1</span><span><b>Nome do processo.</b> A caixa escura identifica qual processo está desenhado.</span></li>
<li><span class="mkr">2</span><span><b>Participantes.</b> Duas raias: Colaborador e Analista financeiro. Toda vez que o fluxo muda de raia, o trabalho passa de um para o outro.</span></li>
<li><span class="mkr">3</span><span><b>Gatilho.</b> O processo começa quando o colaborador realiza uma despesa que precisa ser reembolsada.</span></li>
<li><span class="mkr">4</span><span><b>Decisão.</b> O analista verifica se a documentação está completa. Se estiver, o fluxo segue pelo caminho de cima; se não, o analista solicita os comprovantes faltantes pelo caminho de baixo. Os dois caminhos se reúnem no losango de fechamento.</span></li>
<li><span class="mkr">5</span><span><b>Retrabalho com túneis.</b> Depois da solicitação, o fluxo passa pelo túnel de entrada A e a leitura continua no túnel de saída A, no início do processo: o colaborador envia os comprovantes de novo e a conferência recomeça. Esse ciclo pode se repetir várias vezes.</span></li>
<li><span class="mkr">6</span><span><b>Anotação.</b> O colchete detalha o que é enviado, sem poluir o nome da tarefa.</span></li>
<li><span class="mkr">7</span><span><b>Etapas manuais.</b> O ícone de mão mostra tarefas feitas sem apoio de sistema: conferência, cálculo e arquivamento.</span></li>
<li><span class="mkr">8</span><span><b>Fim.</b> O processo termina depois de uma sequência de quatro etapas do analista, duas delas manuais.</span></li>
</ul>
<h2>Exemplo TO-BE: o mesmo processo redesenhado</h2>
<figure><div class="canvas mid">${D_TOBE}</div><figcaption>No TO-BE entra uma raia para o sistema, que assume as etapas repetitivas.</figcaption></figure>
<h3>O que mudou</h3>
<ul>
<li>O ciclo de reenvio de comprovantes desapareceu: o formulário exige os anexos antes do envio, então não há mais túnel de retorno.</li>
<li>O cálculo e o registro passaram a ser tarefas de serviço, feitas pelo sistema.</li>
<li>O analista deixou de conferir item por item e passou a validar a solicitação conforme a política.</li>
<li>A devolução com justificativa passou a ser um caminho formal do processo, e o sistema avisa o colaborador sobre a decisão nos dois casos.</li>
</ul>`},

{ id:"ferramentas", title:"Ferramentas: Lucid e Notion", time:3,
  scope:"Onde os fluxogramas são desenhados, onde a documentação é consultada e as boas práticas de desenho.",
  resumo:["O Lucid é onde os fluxogramas são desenhados; o Notion é onde são consultados.","Cada processo no Notion traz o fluxograma como imagem e em PDF.","As boas práticas de desenho garantem que todos os fluxogramas sejam lidos da mesma forma."],
  html:`
<p class="lead">O trabalho de documentação usa duas ferramentas com papéis diferentes: uma para desenhar, outra para consultar.</p>
<h2>Lucid: onde os fluxos são desenhados</h2>
<p>O Lucid (Lucidchart) é uma plataforma online de diagramação. Ela tem uma biblioteca própria de formas BPMN 2.0, permite que várias pessoas editem o mesmo desenho e exporta os fluxogramas como imagem ou PDF para compor a documentação.</p>
<h3>Padrões dos fluxogramas do Guia Prático</h3>
<p>Todos os fluxogramas seguem os mesmos padrões, o que permite ler qualquer um deles da mesma forma:</p>
<ul>
<li>O nome do processo aparece acima do desenho.</li>
<li>O fluxo corre da esquerda para a direita; quando não cabe, continua na linha de baixo.</li>
<li>As tarefas são nomeadas com verbo no infinitivo e objeto, e os detalhes ficam nas anotações.</li>
<li>Todo losango de decisão tem um losango de fechamento, onde os caminhos se reúnem.</li>
<li>Retornos a etapas anteriores aparecem como pares de túneis.</li>
<li>Cada raia corresponde a um cargo ou área, com os mesmos nomes do organograma.</li>
<li>Trechos muito extensos podem aparecer como subprocesso.</li>
<li>AS-IS e TO-BE ficam em desenhos separados, com o mesmo nome de processo.</li>
</ul>
<h2>Notion: onde a documentação é consultada</h2>
<p>O Notion reúne a documentação em páginas conectadas. É nele que fica o Guia Prático: uma base com todos os processos mapeados, que pode ser vista por processo, por cargo ou em tabela, e uma página para cada processo com o fluxograma e as suas informações. O módulo 09 explica essa estrutura em detalhe.</p>`},

{ id:"guia-pratico", title:"Como usar o Guia Prático", time:5,
  scope:"Como a documentação está organizada no Notion, o que cada campo significa e como acompanhar os processos.",
  resumo:["Cada processo tem uma página com fluxograma, código, setor, responsável, periodicidade, descrição, valor esperado e gatilho.","A visualização por cargo mostra quantos e quais processos cada função executa.","Os comentários de cada página registram dúvidas e propostas de melhoria."],
  html:`
<p class="lead">O Guia Prático reúne, em um único ambiente no Notion, os processos da empresa e quem os executa. Ele serve tanto para consulta no dia a dia quanto para identificar oportunidades de melhoria.</p>
<h2>Como está organizado</h2>
<p>A página inicial apresenta o Guia Prático e traz a base de processos. Essa base pode ser vista de várias formas, escolhidas nas abas acima dela:</p>
<dl class="terms">
<div><dt>Processos</dt><dd>Quadro com uma coluna por cargo responsável. Cada cartão é um processo, com a miniatura do fluxograma, o código e o início da descrição. O número ao lado do cargo mostra quantos processos ele executa.</dd></div>
<div><dt>Processos (tabela)</dt><dd>Os mesmos processos em formato de lista, útil para filtrar e ordenar por setor, periodicidade ou código.</dd></div>
<div><dt>Cargos e Funcionários</dt><dd>Visualizações que partem das funções e das pessoas, conectando o Guia Prático ao organograma.</dd></div>
</dl>
<p>A busca, no canto superior da página, encontra qualquer processo pelo nome.</p>
<h2>O que tem em cada página de processo</h2>
<dl class="fields">
<div><dt>Fluxograma</dt><dd>Imagem do desenho em BPMN. Clique para ampliar.</dd></div>
<div><dt>PDF</dt><dd>O mesmo fluxograma em PDF, para download ou impressão.</dd></div>
<div><dt>Código</dt><dd>Identificador único: sigla do setor e um número sequencial (por exemplo, RH-004 ou COM-012).</dd></div>
<div><dt>Setor</dt><dd>A área da empresa a que o processo pertence.</dd></div>
<div><dt>Responsável</dt><dd>O cargo que executa o processo.</dd></div>
<div><dt>Periodicidade</dt><dd>Com que frequência o processo acontece: diária, semanal, mensal ou sob demanda.</dd></div>
<div><dt>Descrição</dt><dd>O que o processo faz, em um parágrafo que resume as principais etapas.</dd></div>
<div><dt>Valor esperado</dt><dd>O resultado que o processo deve entregar quando executado corretamente.</dd></div>
<div><dt>Gatilho inicial</dt><dd>O que dispara o processo. Corresponde ao evento inicial do fluxograma.</dd></div>
<div><dt>Comentários</dt><dd>Espaço no fim da página para registrar dúvidas, divergências e sugestões.</dd></div>
</dl>
<h2>Roteiro para estudar um processo</h2>
<ol class="steps">
<li><b>Encontre o processo</b>Pela busca, pela coluna do cargo no quadro ou filtrando o setor na tabela.</li>
<li><b>Leia a descrição e o valor esperado</b>Entenda o que o processo faz e o que ele precisa entregar antes de olhar o desenho.</li>
<li><b>Confira o gatilho</b>Ele deve corresponder ao evento inicial do fluxograma.</li>
<li><b>Leia o fluxograma</b>Siga o roteiro do módulo 07: nome, raias, início, setas, decisões, anotações e fim.</li>
<li><b>Compare com o resultado</b>O fim do desenho deve entregar o que o valor esperado descreve.</li>
</ol>
<h2>Para o gestor: como acompanhar os processos</h2>
<dl class="terms">
<div><dt>Distribuição de trabalho</dt><dd>O quadro por cargo mostra quantos processos cada função concentra. Colunas muito cheias podem indicar sobrecarga ou dependência de uma única pessoa.</dd></div>
<div><dt>Rotina e planejamento</dt><dd>A periodicidade ajuda a organizar a agenda de rotinas: o que acontece todo dia, todo mês ou apenas quando solicitado.</dd></div>
<div><dt>Critério de qualidade</dt><dd>O valor esperado funciona como referência para avaliar se o processo está entregando o que deveria.</dd></div>
<div><dt>Treinamento</dt><dd>Para ensinar uma rotina, envie o link da página do processo para quem vai executá-la.</dd></div>
<div><dt>Melhoria contínua</dt><dd>Use os comentários para registrar pontos de melhoria e divergências entre o desenho e a prática.</dd></div>
</dl>
<div class="callout"><b>Documentação viva</b><p>Um processo que muda na prática precisa mudar também no Guia Prático. Desenho e descrição desatualizados fazem as pessoas voltarem a depender de quem "sabe como faz".</p></div>`},

{ id:"glossario", title:"Glossário e perguntas frequentes", time:4,
  scope:"Os termos usados neste manual e as dúvidas mais comuns sobre mapeamento.",
  html:`
<h2 class="plain">Glossário</h2>
<details><summary>Anotação</summary><div><p>Texto explicativo ligado a um elemento do fluxograma, desenhado como um colchete tracejado.</p></div></details>
<details><summary>AS-IS</summary><div><p>O desenho do processo como ele acontece hoje, incluindo falhas e exceções.</p></div></details>
<details><summary>Atividade</summary><div><p>Uma ação executada dentro de um processo. No BPMN, um retângulo de cantos arredondados.</p></div></details>
<details><summary>BPMN</summary><div><p>Business Process Model and Notation. Linguagem visual padronizada para desenhar processos.</p></div></details>
<details><summary>Código do processo</summary><div><p>Identificador único de cada processo no Guia Prático, formado pela sigla do setor e um número.</p></div></details>
<details><summary>Evento</summary><div><p>Um acontecimento que afeta o processo: o início, algo no meio do caminho ou o fim. No BPMN, um círculo.</p></div></details>
<details><summary>Fluxograma</summary><div><p>Representação visual de um processo. Quando segue as regras do BPMN, cada forma tem um significado padronizado.</p></div></details>
<details><summary>Gargalo</summary><div><p>Etapa que limita o ritmo do processo inteiro, onde o trabalho se acumula.</p></div></details>
<details><summary>Gateway</summary><div><p>Ponto de decisão ou de divisão do fluxo. No BPMN, um losango.</p></div></details>
<details><summary>Gatilho inicial</summary><div><p>O acontecimento que dá início ao processo.</p></div></details>
<details><summary>Macroprocesso</summary><div><p>Conjunto de processos ligados a uma grande função da empresa, como Gestão financeira.</p></div></details>
<details><summary>Organograma</summary><div><p>Representação da estrutura da empresa: setores, cargos e relações de hierarquia.</p></div></details>
<details><summary>Periodicidade</summary><div><p>A frequência com que um processo acontece: diária, semanal, mensal ou sob demanda.</p></div></details>
<details><summary>Piscina</summary><div><p>A moldura que contém o processo inteiro no desenho BPMN.</p></div></details>
<details><summary>Raia</summary><div><p>Faixa dentro da piscina que representa um cargo ou área responsável.</p></div></details>
<details><summary>Redesenho</summary><div><p>A proposta de uma nova versão do processo, que corrige os problemas encontrados no AS-IS.</p></div></details>
<details><summary>Retrabalho</summary><div><p>Atividade refeita por erro, falta de informação ou devolução.</p></div></details>
<details><summary>Subprocesso</summary><div><p>Parte de um processo com lógica própria, que pode ser detalhada em um desenho separado.</p></div></details>
<details><summary>Tarefa</summary><div><p>O menor nível de atividade, que não se divide mais no desenho.</p></div></details>
<details><summary>TO-BE</summary><div><p>O desenho do processo como ele deve passar a funcionar depois da melhoria.</p></div></details>
<details><summary>Túnel</summary><div><p>Evento intermediário do tipo link que liga dois pontos do mesmo processo sem uma seta. O túnel de entrada tem seta preta; o de saída, seta branca.</p></div></details>
<details><summary>Valor esperado</summary><div><p>O resultado que um processo deve entregar quando executado corretamente.</p></div></details>
<h2>Perguntas frequentes</h2>
<details><summary>Preciso saber BPMN para entender a documentação?</summary><div><p>Não em profundidade. Com as formas básicas (círculo, retângulo, losango, seta e raia) e o roteiro de leitura do módulo 07, já é possível entender qualquer fluxograma do Guia Prático.</p></div></details>
<details><summary>Qual a diferença entre um fluxograma comum e um em BPMN?</summary><div><p>Um fluxograma comum pode usar qualquer forma, e cada pessoa interpreta do seu jeito. No BPMN, cada forma tem um significado fixo, o que faz o desenho ser lido da mesma maneira por todos.</p></div></details>
<details><summary>Por que o AS-IS mostra problemas?</summary><div><p>Porque ele retrata o processo real. Os problemas não são uma avaliação de quem executa: são justamente o que orienta a melhoria.</p></div></details>
<details><summary>Se existe um TO-BE, o processo já mudou?</summary><div><p>Não necessariamente. O TO-BE é a versão desejada e precisa ser implementada. Até lá, o AS-IS descreve a prática atual.</p></div></details>
<details><summary>Por que as raias têm cargos e não nomes de pessoas?</summary><div><p>Para que a documentação continue válida quando alguém mudar de função ou sair da empresa. O processo pertence ao cargo, não à pessoa.</p></div></details>
<details><summary>O que fazer quando o processo real mudar?</summary><div><p>Atualizar o fluxograma e as informações da página no Guia Prático. Uma documentação desatualizada perde a confiança de quem consulta.</p></div></details>
<details><summary>Posso repassar este manual aos colaboradores?</summary><div><p>Sim. O resumo no topo de cada módulo atende a uma leitura rápida, e o conteúdo completo serve como material de estudo para quem vai consultar ou executar os processos.</p></div></details>`}
];

/* ---------- Rotas ---------- */
const ROUTES = [];
SECTIONS.forEach((s, i) => {
  s.n = i + 1;
  ROUTES.push({ key:s.id, sec:s, sub:null, title:s.title });
  (s.subs || []).forEach(sb => ROUTES.push({ key:s.id + "/" + sb.id, sec:s, sub:sb, title:sb.title }));
});
const TOTAL = SECTIONS.length;
const pad = n => String(n).padStart(2, "0");

/* ---------- Progresso de leitura ---------- */
const KEY = "manual-mapeamento-v2";
let state = { seen:{}, last:"" };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const seenCount = () => SECTIONS.filter(s => state.seen[s.id]).length;
function markSeen(key){ if (!key || state.seen[key]) return; state.seen[key] = true; save(); refreshChrome(); }

const CHECK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_R = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_L = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const $ = id => document.getElementById(id);
const view = $("view"), index = $("index"), scrim = $("scrim"), menuBtn = $("menuBtn");
let current = "";

function refreshChrome(){
  const n = seenCount();
  $("barFill").style.width = (n / TOTAL * 100) + "%";
  $("progText").textContent = `${n} de ${TOTAL}`;
  $("ixList").innerHTML = SECTIONS.map(s => {
    const inSec = current === s.id || current.startsWith(s.id + "/");
    const subs = (s.subs && inSec) ? `<ul class="ix-sub">${s.subs.map(sb => {
      const k = s.id + "/" + sb.id;
      return `<li><a class="ix-item${state.seen[k] ? " seen" : ""}" href="#/${k}" ${current === k ? 'aria-current="page"' : ""}><span class="ix-t">${sb.title}</span><span class="ix-ok" aria-hidden="true">${CHECK}</span></a></li>`;
    }).join("")}</ul>` : "";
    return `<li><a class="ix-item${state.seen[s.id] ? " seen" : ""}" href="#/${s.id}" ${current === s.id ? 'aria-current="page"' : ""}><span class="ix-n">${pad(s.n)}</span><span class="ix-t">${s.title}</span><span class="ix-ok" aria-hidden="true">${CHECK}</span></a>${subs}</li>`;
  }).join("");
  if (current === "") $("ixHome").setAttribute("aria-current", "page"); else $("ixHome").removeAttribute("aria-current");
  document.querySelectorAll(".toc a").forEach(a => a.classList.toggle("seen", !!state.seen[a.dataset.k]));
}
function openIndex(open){
  index.classList.toggle("open", open); scrim.classList.toggle("show", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  if (open) index.querySelector("a,button").focus();
}
menuBtn.addEventListener("click", () => openIndex(true));
$("ixClose").addEventListener("click", () => { openIndex(false); menuBtn.focus(); });
scrim.addEventListener("click", () => openIndex(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && index.classList.contains("open")) { openIndex(false); menuBtn.focus(); } });
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Limpar o progresso de leitura deste manual?")) return;
  state = { seen:{}, last:"" }; save(); location.hash = "#/"; refreshChrome();
});

function renderHome(){
  const last = ROUTES.find(r => r.key === state.last);
  const firstLabel = last ? `Continuar: ${last.title}` : "Começar a leitura";
  const firstHref = last ? `#/${last.key}` : `#/${SECTIONS[0].id}`;
  view.innerHTML = `
<section class="sheet cover">
  <div class="hero-flow">${HERO}</div>
  <h1 class="display" tabindex="-1">Manual de mapeamento de processos</h1>
  <p class="lead">Um guia sobre o que são processos, como eles são mapeados e redesenhados, e como ler os fluxogramas em BPMN e as páginas que compõem o Guia Prático no Notion.</p>
  <div class="actions"><a class="btn primary" href="${firstHref}">${firstLabel}${CHEV_R}</a>${last ? `<a class="btn" href="#/${SECTIONS[0].id}">Ler do início</a>` : ""}</div>
  <div class="howto">
    <div><b>Leitura rápida</b><span>Cada módulo começa com um resumo dos pontos principais, pensado para o gestor.</span></div>
    <div><b>Material de estudo</b><span>O conteúdo completo pode ser repassado aos colaboradores que consultam ou executam os processos.</span></div>
  </div>
</section>
<section class="sheet">
  <h2 class="plain section-title">Sumário</h2>
  <p class="muted" style="font-size:.9rem">${TOTAL} módulos, pensados para leitura em sequência. O progresso fica salvo neste navegador.</p>
  <ul class="toc">${SECTIONS.map(s => `<li><a href="#/${s.id}" data-k="${s.id}"><span><span class="n display">${pad(s.n)}.</span><b>${s.title}</b><span>${s.scope}</span></span><span class="ok" aria-label="Lido">${CHECK}</span></a></li>`).join("")}</ul>
</section>`;
}

function renderRoute(r){
  const s = r.sec, sb = r.sub;
  const i = ROUTES.indexOf(r), prev = ROUTES[i-1], next = ROUTES[i+1];
  const crumbs = [`<a href="#/">Início</a>`];
  if (sb) crumbs.push(`<a href="#/${s.id}">${s.title}</a>`, `<span aria-current="page">${sb.title}</span>`);
  else crumbs.push(`<span aria-current="page">${s.title}</span>`);
  const subIndex = (!sb && s.subs) ? `<ul class="subindex">${s.subs.map(x => {
    const k = s.id + "/" + x.id;
    return `<li><a href="#/${k}"><span class="fig">${x.icon}</span><span><b>${x.title}</b><span>${x.desc}</span>${state.seen[k] ? `<span class="seen-tag">Lido</span>` : ""}</span></a></li>`;
  }).join("")}</ul>` : "";
  const time = sb ? 3 : s.time;
  const pills = [`Módulo ${pad(s.n)} de ${pad(TOTAL)}`, sb ? `Parte de ${s.title}` : null, `Leitura: cerca de ${time} min`].filter(Boolean);
  view.innerHTML = `
<article class="sheet">
  <nav class="crumbs" aria-label="Caminho">${crumbs.join("<span aria-hidden=\"true\">/</span>")}</nav>
  <header class="mod-head">
    <div class="mod-pills">${pills.map(p => `<span>${p}</span>`).join("")}</div>
    <span class="mod-num display" aria-hidden="true">${pad(s.n)}.</span>
    <h1 class="display" tabindex="-1">${sb ? sb.title : s.title}</h1>
    <p>${sb ? sb.desc : s.scope}</p>
  </header>
  ${!sb && s.resumo ? resumo(s.resumo) : ""}
  ${sb ? sb.html : s.html}
  ${subIndex}
  <nav class="pagenav" aria-label="Navegação entre módulos">
    ${prev ? `<a class="btn" href="#/${prev.key}">${CHEV_L}<span><small>Voltar</small>${prev.title}</span></a>` : `<a class="btn" href="#/">${CHEV_L}<span><small>Voltar</small>Capa</span></a>`}
    ${next ? `<a class="btn primary next" href="#/${next.key}" data-mark="${r.key}"><span><small>Avançar</small>${next.title}</span>${CHEV_R}</a>` : `<a class="btn primary next" href="#/" data-mark="${r.key}"><span><small>Fim do manual</small>Voltar à capa</span>${CHEV_R}</a>`}
  </nav>
</article>`;
  const nav = view.querySelector(".pagenav");
  if ("IntersectionObserver" in window){
    const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting){ markSeen(r.key); io.disconnect(); } }); }, { threshold:.6 });
    io.observe(nav);
  }
  nav.querySelector("[data-mark]").addEventListener("click", () => markSeen(r.key));
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const r = ROUTES.find(x => x.key === h);
  current = r ? r.key : "";
  if (r){ renderRoute(r); state.last = r.key; save(); }
  else renderHome();
  refreshChrome();
  openIndex(false);
  window.scrollTo(0, 0);
  const h1 = view.querySelector("h1"); if (h1) h1.focus({ preventScroll:true });
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
